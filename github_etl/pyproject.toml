[project]
name = "github-etl"
version = "0.1.0"
description = "ETL for PostHog/posthog PR commits over a rolling window."
authors = [
    { name = "steffendreesen", email = "sdreese@clemson.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
]

[project.scripts]
github-etl = "github_etl.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
