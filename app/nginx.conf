server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
}
