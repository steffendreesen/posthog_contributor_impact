[project]
name = "impact-model"
version = "0.1.0"
description = "Commit impact scoring and hierarchical model inputs for PostHog contributor impact."
requires-python = ">=3.12"
dependencies = [
    "github-etl",
    "numpy>=2.2.0",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
github-etl = { path = "../github_etl", editable = true }
